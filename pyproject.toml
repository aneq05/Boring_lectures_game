[project]
name = "let_me_tango"
version = "0.1.0"
dependencies = [
    "pygame>=2.5.0",
]


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "game*", "ui*"]
exclude = ["assets*"]